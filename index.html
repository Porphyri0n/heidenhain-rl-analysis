<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description"
    content="Heidenhain Klartext (.H) / ISO kontur yarıçap ve DR penceresi analizi — tarayıcıda çalışır. Contour radius and DR window analysis for Heidenhain programs, runs in the browser.">
  <title>Kontur Yarıçap Analizi — Heidenhain .H</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>
  <div class="wrap">

    <header class="top">
      <div class="brand">
        <h1 data-i18n="app.h1">Kontur Yarıçap Analizi</h1>
        <p data-i18n-html="app.lead"></p>
      </div>
      <div class="topright">
        <div class="stamp" data-i18n="app.stamp"></div>
        <div class="langbar" id="langbar" role="group" data-i18n-aria="app.langAria"></div>
      </div>
    </header>

    <div class="grid">

      <!-- ============ SOL: GİRİŞ / LEFT: INPUT ============ -->
      <div class="stack">
        <section class="card">
          <h2 data-i18n="card.program">1 · Program</h2>
          <div class="body">
            <div class="drop" id="drop" tabindex="0" role="button" data-i18n-html="drop.idle"></div>
            <input type="file" id="file" accept=".h,.hc,.H,.i,.I,.nc,.NC,.txt" hidden>
            <div style="margin-top:10px">
              <label class="f" for="src" data-i18n="label.src"></label>
              <textarea id="src" spellcheck="false" data-i18n-ph="ph.src"></textarea>
            </div>
            <div class="btnrow">
              <button id="run" data-i18n="btn.run"></button>
              <button class="ghost" id="sample" data-i18n="btn.sample"></button>
              <button class="ghost" id="clear" data-i18n="btn.clear"></button>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="card.tool">2 · Takım</h2>
          <div class="body">
            <div class="row">
              <div>
                <label class="f" for="rtab" data-i18n="label.rtab"></label>
                <input type="number" id="rtab" value="0.25" step="0.01" min="0" inputmode="decimal">
              </div>
              <div>
                <label class="f" for="drcur" data-i18n="label.drcur"></label>
                <input type="number" id="drcur" value="-0.25" step="0.01" inputmode="decimal">
              </div>
            </div>
            <p class="hint" data-i18n-html="hint.eff"></p>
            <div class="row" style="margin-top:10px">
              <div>
                <label class="f" for="rphys" data-i18n="label.rphys"></label>
                <input type="number" id="rphys" value="0.25" step="0.005" min="0.001" inputmode="decimal">
              </div>
              <div>
                <label class="f" for="drref" data-i18n="label.drref"></label>
                <input type="number" id="drref" value="-0.25" step="0.01" inputmode="decimal">
              </div>
            </div>
            <p class="hint" data-i18n-html="hint.dev"></p>
            <div class="row" style="margin-top:10px">
              <div>
                <label class="f" for="safety" data-i18n="label.safety"></label>
                <input type="number" id="safety" value="0.005" step="0.005" min="0" inputmode="decimal">
              </div>
              <div>
                <label class="f" for="tol" data-i18n="label.tol"></label>
                <input type="number" id="tol" value="0.002" step="0.001" min="0.0005" inputmode="decimal">
              </div>
            </div>

            <label class="chkline">
              <input type="checkbox" id="gouge">
              <span data-i18n="chk.gouge"></span>
            </label>

            <label class="chkline">
              <input type="checkbox" id="outAllow">
              <span data-i18n-html="chk.outAllow"></span>
            </label>

            <div class="row" style="margin-top:10px">
              <div>
                <label class="f" for="outcap" data-i18n="label.outcap"></label>
                <input type="number" id="outcap" value="0.3" step="0.01" min="0" inputmode="decimal" disabled>
              </div>
              <div>
                <p class="hint" style="margin:18px 0 0" data-i18n="hint.outcap"></p>
              </div>
            </div>
            <p class="hint" data-i18n-html="hint.outoffset"></p>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="card.howto">Nasıl okunur</h2>
          <div class="body">
            <ul class="notes">
              <li data-i18n-html="howto.1"></li>
              <li data-i18n-html="howto.2"></li>
              <li data-i18n-html="howto.3"></li>
              <li data-i18n-html="howto.4"></li>
              <li data-i18n-html="howto.5"></li>
              <li data-i18n-html="howto.6"></li>
              <li data-i18n-html="howto.7"></li>
              <li data-i18n-html="howto.8"></li>
              <li data-i18n-html="howto.9"></li>
            </ul>
          </div>
        </section>
      </div>

      <!-- ============ SAĞ: SONUÇ / RIGHT: RESULTS ============ -->
      <div class="stack">

        <div id="verdict" class="verdict idle"></div>

        <div class="dro three">
          <div class="cell" id="cellMin">
            <div class="k" id="kMin"></div>
            <div class="v" id="vMin">—</div>
            <div class="sub" id="sMin"></div>
          </div>
          <div class="cell" id="cellMax">
            <div class="k" data-i18n="dro.maxCtl"></div>
            <div class="v" id="vMax">—</div>
            <div class="sub" id="sMax"></div>
          </div>
          <div class="cell" id="cellForm">
            <div class="k" data-i18n="dro.maxForm"></div>
            <div class="v" id="vForm">—</div>
            <div class="sub" id="sForm"></div>
          </div>
        </div>

        <section class="card">
          <h2><span data-i18n="card.window"></span><span id="winNote"
              style="text-transform:none;letter-spacing:0"></span></h2>
          <div class="body">
            <div class="band" id="band"></div>
            <div class="bandaxis" id="bandAxis"></div>
            <div class="bandkey">
              <span id="keyOut" style="display:none"><i class="o" style="background:#b9d4e6"></i><span
                  data-i18n="band.out"></span></span>
              <span><i class="g" style="background:#c3dfcc"></i><span data-i18n="band.green"></span></span>
              <span><i class="a" style="background:#f0daaa"></i><span data-i18n="band.amber"></span></span>
              <span><i class="r" style="background:#eebeb8"></i><span data-i18n="band.red"></span></span>
            </div>
            <div class="wintxt" id="winTxt"></div>
          </div>
        </section>

        <section class="card">
          <h2><span data-i18n="card.plot"></span><span id="plotTitle"></span></h2>
          <div class="plotwrap">
            <canvas id="cv"></canvas>
          </div>
          <div class="plotbar">
            <label class="f" for="rng" style="margin:0;white-space:nowrap" data-i18n="plot.testdr"></label>
            <input type="range" id="rng" min="0" max="100" value="50" step="1" disabled>
            <span class="blk" id="rngVal" style="min-width:86px;text-align:right">— mm</span>
            <button class="ghost" id="fit" style="padding:5px 10px;font-size:12px" data-i18n="plot.fit"></button>
          </div>
          <div class="legend">
            <span><i style="background:#0d1418"></i><span data-i18n="legend.contour"></span></span>
            <span><i style="background:#14507e"></i><span data-i18n="legend.center"></span></span>
            <span><i style="background:#b32319"></i><span data-i18n="legend.gouge"></span></span>
            <span><i style="background:#0f7d86"></i><span data-i18n="legend.channel"></span></span>
            <span><i style="background:#7a3fa8"></i><span data-i18n="legend.plunge"></span></span>
            <span><i style="background:#b57405"></i><span data-i18n="legend.damage"></span></span>
          </div>
          <div class="chips" id="conChips" style="padding:0 12px 12px"></div>
        </section>

        <section class="card">
          <h2><span data-i18n="card.links"></span><span id="lnkAt" style="text-transform:none;letter-spacing:0"></span>
          </h2>
          <div id="lnkBox"></div>
        </section>

        <section class="card">
          <h2><span data-i18n="card.damage"></span><span id="dmgAt" style="text-transform:none;letter-spacing:0"></span>
          </h2>
          <div id="dmgBox"></div>
        </section>

        <div class="actionbar">
          <button class="ghost" id="dl" data-i18n="btn.annotate"></button>
          <button class="ghost" id="toggleDet" data-i18n="btn.detailsShow"></button>
        </div>

        <section class="card det" style="display:none">
          <h2 data-i18n="card.crit"></h2>
          <div id="critBox"></div>
        </section>

        <section class="card det" style="display:none">
          <h2 data-i18n="card.corners"></h2>
          <div id="cornBox"></div>
        </section>

        <section class="card det" style="display:none">
          <h2 data-i18n="card.contours"></h2>
          <div id="conBox"></div>
        </section>

        <section class="card det" style="display:none">
          <h2 data-i18n="card.parse"></h2>
          <div id="warnBox"></div>
        </section>

      </div>
    </div>

    <footer data-i18n="app.footer"></footer>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/i18n/tr.js"></script>
  <script src="assets/js/i18n/en.js"></script>
  <script src="assets/js/geometry.js"></script>
  <script src="assets/js/parser.js"></script>
  <script src="assets/js/offset.js"></script>
  <script src="assets/js/analysis.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
